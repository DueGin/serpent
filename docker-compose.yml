# SERPENT 一体化部署。
#   服务器直接用发布镜像：  docker compose pull && docker compose up -d
#   本地从源码构建：        docker compose up -d --build
# 可在同目录 .env 中覆盖下列变量（见 .env.example）。
name: serpent

services:
  serpent:
    image: ${SERPENT_IMAGE:-ghcr.io/duegin/serpent:latest}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    # 由 tini 作为 1 号进程转发信号并回收子进程（Python 沙箱会启动子进程）。
    init: true
    # Python 脚本的每个解释器都在 bubblewrap 中运行（独立网络/进程/文件系统命名空间），
    # 它需要在容器内创建用户命名空间并挂载 /proc，Docker 默认的这三项限制会阻止它。
    # 容器仍以无 capability 的 node 用户运行。不需要 Python 时可删除这三行，
    # Python 会被明确拒绝（PYTHON_UNAVAILABLE），JavaScript 不受影响。详见 docs/deploy.md。
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${SERPENT_PORT:-8008}:8008"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8008}
      # 为空时首次启动自动生成并保存到数据卷。
      JWT_SECRET: ${JWT_SECRET:-}
      LADDER_AUTO: ${LADDER_AUTO:-1}
      RUNNER_WORKERS: ${RUNNER_WORKERS:-}
      PYTHON_MAX_HOSTS: ${PYTHON_MAX_HOSTS:-4}
      PYTHON_WARM_HOSTS: ${PYTHON_WARM_HOSTS:-1}
    volumes:
      - serpent-data:/app/server/data

volumes:
  serpent-data:
