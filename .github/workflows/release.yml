name: Release

# 推送 vX.Y.Z 标签发版：测试 → 构建 amd64/arm64 镜像推送到 GHCR → 创建 GitHub Release。
# 手动运行（workflow_dispatch）默认只构建不推送，用于演练。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push:
        description: 推送镜像到 GHCR（不会创建 Release）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    name: 构建并推送镜像
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 标签必须与 package.json 版本一致
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $expected 不一致"
            exit 1
          fi
      - name: 镜像名（GHCR 要求小写）
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=${{ github.ref_type == 'tag' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' || inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=serpent-release
          cache-to: type=gha,mode=max,scope=serpent-release

  release:
    name: 创建 GitHub Release
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 生成发布说明并创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## 镜像

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          升级：在部署目录把 \`.env\` 中的 \`SERPENT_IMAGE\` 设为 \`${IMAGE}:${VERSION}\`（或保持 \`latest\`），然后执行 \`docker compose pull && docker compose up -d\`。部署说明见 [docs/deploy.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/deploy.md)。
          EOF
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
