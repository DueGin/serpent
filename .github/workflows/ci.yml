name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 测试、类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 服务端测试
        run: pnpm --filter server test
      - name: 服务端类型检查
        working-directory: server
        run: npx tsc --noEmit
      - name: 前端类型检查
        working-directory: web
        run: npx tsc --noEmit
      - name: 构建
        run: pnpm build

  docker:
    name: 镜像构建与启动冒烟
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: serpent:ci
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=serpent-amd64
          cache-to: type=gha,mode=max,scope=serpent-amd64
      - name: 启动容器并检查网页、接口与 MCP
        run: |
          docker run -d --name serpent -p 8008:8008 -e LADDER_AUTO=0 serpent:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8008/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8008/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8008/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8008/matches/1)" = 200
          curl -sf http://localhost:8008/api/docs/rules >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8008/mcp)" = 405
      - name: 容器日志
        if: always()
        run: docker logs serpent || true
