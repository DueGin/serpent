name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 测试、类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 准备 Python 沙箱（bubblewrap 与非特权用户命名空间）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 23.10+ 默认限制非特权用户命名空间，bubblewrap 需要它为每个解释器建立隔离。
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind / / -- /bin/true
      - name: 服务端测试
        run: pnpm --filter server test
      - name: 服务端类型检查
        working-directory: server
        run: npx tsc --noEmit
      - name: 前端类型检查
        working-directory: web
        run: npx tsc --noEmit
      - name: 构建
        run: pnpm build

  docker:
    name: 镜像构建与启动冒烟
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: serpent:ci
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=serpent-amd64
          cache-to: type=gha,mode=max,scope=serpent-amd64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 放开宿主的非特权用户命名空间限制（容器内 Python 沙箱需要）
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: 按生产配置启动容器并检查网页、接口、MCP 与 JS/Python 对局
        run: |
          docker run -d --name serpent -p 8008:8008 -e LADDER_AUTO=0 --init \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined serpent:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8008/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8008/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8008/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8008/matches/1)" = 200
          curl -sf http://localhost:8008/api/docs/rules >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8008/mcp)" = 405
          node scripts/smoke.mjs http://localhost:8008 --python
      - name: 容器日志
        if: always()
        run: docker logs serpent || true
